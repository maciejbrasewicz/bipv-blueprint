name: Temporary UX candidate formatter
on:
  pull_request:
    paths:
      - "web/src/**"
      - "web/e2e/**"
      - ".github/workflows/ux-candidate-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 23 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm run format --prefix web
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src web/e2e
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to premium UX workbench"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
