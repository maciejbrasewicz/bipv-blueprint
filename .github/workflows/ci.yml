name: Quality gates
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "foundry/**", "README.md", "AGENTS.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: uv sync --frozen --dev
      - run: uv run ruff check server
      - run: uv run ruff format --check server
      - run: uv run pytest -q
      - run: uv export --frozen --no-dev --no-hashes --format requirements-txt --output-file requirements.txt > /dev/null && git diff --exit-code requirements.txt
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm run format:check --prefix web
      - run: npm run build --prefix web
      - name: Install headless Chromium
        timeout-minutes: 3
        run: npx playwright install --only-shell chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Verify the Docker runtime at the production resource limits
        run: |
          docker build -t bipv-studio-ci .
          cid=$(docker run -d --memory=250000000 --cpus=0.1 -p 127.0.0.1:8081:8080 bipv-studio-ci)
          trap 'docker rm -f "$cid"' EXIT
          python - <<'PY'
          import json,time,urllib.request
          for i in range(90):
              try:
                  health=json.load(urllib.request.urlopen("http://127.0.0.1:8081/api/health",timeout=3))
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("Container did not become healthy at 250 MB / 0.1 CPU")
          req=urllib.request.Request("http://127.0.0.1:8081/api/layout",data=b"{}",headers={"Content-Type":"application/json"})
          result=json.load(urllib.request.urlopen(req,timeout=60))
          assert result["variants"][0]["module_count"] > 0
          print({"health":health["status"],"modules":result["variants"][0]["module_count"]})
          PY
          docker stats --no-stream --format '{{.CPUPerc}} {{.MemUsage}}' "$cid"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studio-browser-evidence
          path: web/test-results/
          retention-days: 7
      - name: Publish visual review evidence
        if: always() && github.ref == 'refs/heads/main'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f web/test-results/studio-desktop-review.jpg ]; then
            python -c "import base64,pathlib; s=base64.b64encode(pathlib.Path('web/test-results/studio-desktop-review.jpg').read_bytes()).decode(); [print('VISUAL_CHUNK_'+str(i//4000).zfill(4)+':'+s[i:i+4000]) for i in range(0,len(s),4000)]"
          fi
          if [ -f web/test-results/studio-mobile-review.jpg ]; then
            python -c "import base64,pathlib; s=base64.b64encode(pathlib.Path('web/test-results/studio-mobile-review.jpg').read_bytes()).decode(); [print('MOBILE_VISUAL_CHUNK_'+str(i//4000).zfill(4)+':'+s[i:i+4000]) for i in range(0,len(s),4000)]"
          fi
          git fetch origin evidence/r1
          git worktree add /tmp/bipv-evidence origin/evidence/r1
          mkdir -p /tmp/bipv-evidence/evidence
          find web/test-results -type f \( -name '*.png' -o -name '*.jpg' -o -name 'error-context.md' \) -exec cp {} /tmp/bipv-evidence/evidence/ \; || true
          python -c "import json,os,pathlib,subprocess; pathlib.Path('/tmp/bipv-evidence/evidence/run.json').write_text(json.dumps({'tested_commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'status':os.environ['JOB_STATUS'],'run_id':os.environ['GITHUB_RUN_ID']},indent=2))"
          git -C /tmp/bipv-evidence config user.name "github-actions[bot]"
          git -C /tmp/bipv-evidence config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/bipv-evidence add evidence
          git -C /tmp/bipv-evidence diff --cached --quiet || git -C /tmp/bipv-evidence commit -m "Record R1 browser evidence"
          git -C /tmp/bipv-evidence push origin HEAD:evidence/r1
