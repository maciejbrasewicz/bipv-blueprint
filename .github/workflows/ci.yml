name: Quality gates
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "foundry/**", "README.md", "AGENTS.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: uv sync --frozen --dev
      - run: uv run ruff check server scripts/check_electrotile_run.py
      - run: uv run ruff format --check server scripts/check_electrotile_run.py
      - name: Record Studio test scope and run Python regression tests
        run: |
          mkdir -p "$RUNNER_TEMP/studio-python-evidence"
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "studio-python-evidence"
          paths = (
              "uv.lock",
              "scripts/check_electrotile_run.py",
              "server/tests/test_electrotile_run.py",
              "server/tests/test_geometry_regression.py",
          )
          manifest = {
              "scope": "studio-fixture",
              "tested_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "python": platform.python_version(),
              "platform": platform.platform(),
              "sha256": {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths},
          }
          (evidence / "run.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          uv run --frozen pytest -q --junitxml "$RUNNER_TEMP/studio-python-evidence/python-tests.xml"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studio-python-evidence
          path: ${{ runner.temp }}/studio-python-evidence/
          retention-days: 90
      - name: Verify organization migration preserves guest projects
        timeout-minutes: 4
        run: |
          cid=$(docker run -d --rm -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine)
          trap 'docker stop "$cid" >/dev/null' EXIT
          for i in {1..30}; do
            if docker exec "$cid" pg_isready -h 127.0.0.1 -U postgres >/dev/null; then break; fi
            sleep 1
          done
          sql() { docker exec -i "$cid" psql -h 127.0.0.1 -U postgres -Xv ON_ERROR_STOP=1 "$@"; }
          sql < supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            if [[ "$migration" == *_product_organizations.sql ]]; then
              sql < supabase/tests/before_product_organizations.sql
              sql < "$migration"
              sql < supabase/tests/product_organizations.sql
            else
              sql < "$migration"
            fi
          done
          { echo 'begin;'; cat supabase/tests/organization_project_access.sql; echo 'rollback;'; } | sql
      - run: uv export --frozen --no-dev --no-hashes --format requirements-txt --output-file requirements.txt > /dev/null && git diff --exit-code requirements.txt
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm run format:check --prefix web
      - run: npm run build --prefix web
      - name: Install headless Chromium
        timeout-minutes: 3
        run: npx playwright install --only-shell chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Verify the Docker runtime at the production resource limits
        run: |
          docker build -t bipv-studio-ci .
          cid=$(docker run -d --memory=250000000 --cpus=0.1 -p 127.0.0.1:8081:8080 bipv-studio-ci)
          trap 'docker rm -f "$cid"' EXIT
          python - <<'PY'
          import json,time,urllib.request
          for i in range(90):
              try:
                  health=json.load(urllib.request.urlopen("http://127.0.0.1:8081/api/health",timeout=3))
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("Container did not become healthy at 250 MB / 0.1 CPU")
          req=urllib.request.Request("http://127.0.0.1:8081/api/layout",data=b"{}",headers={"Content-Type":"application/json"})
          result=json.load(urllib.request.urlopen(req,timeout=60))
          assert result["variants"][0]["module_count"] > 0
          print({"health":health["status"],"modules":result["variants"][0]["module_count"]})
          larger={
              "product_id":"tile-32",
              "surfaces":["qa-large-roof"],
              "custom_surfaces":[{
                  "id":"qa-large-roof",
                  "name":"Budynek referencyjny 40 x 20 m",
                  "kind":"roof",
                  "origin":[0,0,6],
                  "u":[1,0,0],
                  "v":[0,1,0],
                  "boundary_uv_m":[[-20,-10],[20,-10],[20,10],[-20,10]]
              }]
          }
          req=urllib.request.Request("http://127.0.0.1:8081/api/layout",data=json.dumps(larger).encode(),headers={"Content-Type":"application/json"})
          start=time.monotonic()
          result=json.load(urllib.request.urlopen(req,timeout=80))
          elapsed=time.monotonic()-start
          assert result["variants"][0]["module_count"] > 0, "Large roof cannot silently return zero"
          assert result["variants"][0]["roof_area_m2"] == 800
          assert elapsed < 60, f"Large roof exceeded interactive budget: {elapsed:.2f}s"
          print({"large_roof_modules":result["variants"][0]["module_count"],"response_seconds":round(elapsed,2)})
          PY
          docker stats --no-stream --format '{{.CPUPerc}} {{.MemUsage}}' "$cid"
      - name: Verify the runnable roof-test archive
        run: |
          mkdir -p dist
          evidence="$PWD/dist"
          archive="$evidence/BIPV-Roof-Tests.zip"
          python scripts/package_roof_tests.py "$archive" --source-sha "$GITHUB_SHA"
          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          unzip -q "$archive" -d "$unpacked"
          (
            cd "$unpacked"
            uv sync --frozen --dev
            uv run --frozen pytest -q --junitxml "$evidence/roof-test-results.xml"
            uv run --frozen python -m scripts.benchmark_roof_tests --output "$evidence/roof-benchmark.json"
          )
          python scripts/package_roof_tests.py "$archive" --source-sha "$GITHUB_SHA" --evidence-dir "$evidence"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bipv-roof-tests
          path: dist/BIPV-Roof-Tests.zip
          if-no-files-found: error
          retention-days: 90
      - name: Build and audit public source-and-test review ZIP
        timeout-minutes: 8
        run: |
          archive="$PWD/dist/Registry9-ET-2025-7-Source-and-Tests.zip"
          python scripts/package_public_review.py "$archive" --source-sha "$GITHUB_SHA" --evidence-dir "$PWD/dist"
          python scripts/verify_public_review.py "$archive"
          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          unzip -q "$archive" -d "$unpacked"
          (
            cd "$unpacked"
            uv sync --python 3.12 --frozen --dev
            uv run --frozen pytest -q
            uv run --frozen python -m scripts.benchmark_roof_tests --output "$unpacked/evaluation-benchmark.json"
            uv run --frozen python -m scripts.run_electrotile_3d_case "$unpacked/evaluation-et-3d-01"
            uv run --frozen python -m scripts.run_electrotile_production_case "$unpacked/evaluation-et-prod-01"
          )
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: electrotile-source-review-zip
          path: dist/Registry9-ET-2025-7-Source-and-Tests.zip
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studio-browser-evidence
          path: web/test-results/
          retention-days: 7
      - name: Publish visual review evidence
        if: always() && github.ref == 'refs/heads/main'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f web/test-results/studio-desktop-review.jpg ]; then
            python -c "import base64,pathlib; s=base64.b64encode(pathlib.Path('web/test-results/studio-desktop-review.jpg').read_bytes()).decode(); [print('VISUAL_CHUNK_'+str(i//4000).zfill(4)+':'+s[i:i+4000]) for i in range(0,len(s),4000)]"
          fi
          if [ -f web/test-results/studio-mobile-review.jpg ]; then
            python -c "import base64,pathlib; s=base64.b64encode(pathlib.Path('web/test-results/studio-mobile-review.jpg').read_bytes()).decode(); [print('MOBILE_VISUAL_CHUNK_'+str(i//4000).zfill(4)+':'+s[i:i+4000]) for i in range(0,len(s),4000)]"
          fi
          git fetch origin evidence/r1
          git worktree add /tmp/bipv-evidence origin/evidence/r1
          mkdir -p /tmp/bipv-evidence/evidence
          find web/test-results -type f \( -name '*.png' -o -name '*.jpg' -o -name 'error-context.md' \) -exec cp {} /tmp/bipv-evidence/evidence/ \; || true
          python -c "import json,os,pathlib,subprocess; pathlib.Path('/tmp/bipv-evidence/evidence/run.json').write_text(json.dumps({'tested_commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'status':os.environ['JOB_STATUS'],'run_id':os.environ['GITHUB_RUN_ID']},indent=2))"
          git -C /tmp/bipv-evidence config user.name "github-actions[bot]"
          git -C /tmp/bipv-evidence config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/bipv-evidence add evidence
          git -C /tmp/bipv-evidence diff --cached --quiet || git -C /tmp/bipv-evidence commit -m "Record R1 browser evidence"
          git -C /tmp/bipv-evidence push origin HEAD:evidence/r1
