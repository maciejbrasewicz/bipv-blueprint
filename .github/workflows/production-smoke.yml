name: Production verification
on:
  push:
    branches: [main]
    paths: ['docs/production-target.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-verification
  cancel-in-progress: true
env:
  BASE_URL: https://bipv-studio-production.up.railway.app
  LIVE_CLOUD: '1'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify the deployed commit and cloud configuration
        id: deployed
        run: |
          python - <<'PY'
          import json,os,pathlib,re,time,urllib.request
          target=json.loads(pathlib.Path("docs/production-target.json").read_text())
          expected=target["commit"]
          assert re.fullmatch("[a-f0-9]{40}",expected)
          for attempt in range(8):
              try:
                  health=json.load(urllib.request.urlopen(os.environ["BASE_URL"]+"/api/health",timeout=20))
                  break
              except Exception:
                  if attempt==7:
                      raise
                  time.sleep(3)
          assert health["commit"]==expected,(health["commit"],expected)
          assert health["cloud_configured"] is True
          assert health["status"]=="ok"
          print(json.dumps({"live_commit":expected,"cloud_configured":True,"status":"ok"}))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("geo=" + str(bool(target.get("geo"))).lower(), file=output)
          PY
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Verify live v1/v2 revisions and workspace isolation
        run: npx playwright test --grep "live cloud isolates"
        working-directory: web
      - name: Verify live GUGiK address and footprints
        if: steps.deployed.outputs.geo == 'true'
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import json,os,time,urllib.error,urllib.request
          base=os.environ["BASE_URL"]+"/api/geo/"
          def post(path, payload):
              request=urllib.request.Request(base+path,data=json.dumps(payload).encode(),
                                             headers={"Content-Type":"application/json"})
              for attempt in range(2):
                  try:
                      with urllib.request.urlopen(request,timeout=35) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if attempt or error.code not in (502, 503, 504):
                          print(error.read(4096).decode(errors="replace"))
                          raise
                      time.sleep(2)
          points=post("addresses",{"address":"Marki, Andersa 1"})["candidates"]
          candidates=[point for point in points if point["label"].startswith("Marki,")]
          assert candidates, "No Marki candidate"
          result=post("buildings",candidates[0])
          assert result["candidates"], "No footprint candidates at the documented GUGiK sample"
          print({"addresses":len(points),"footprints":len(result["candidates"]),"partial":result["partial"]})
          PY
      - name: Install only the headless browser
        timeout-minutes: 3
        run: npx playwright install --only-shell chromium
        working-directory: web
      - name: Verify the live studio, UI save and Scene v2 editing
        env:
          GEO_ENABLED: ${{ steps.deployed.outputs.geo }}
        run: |
          filter="studio renders|Scene v2 hole correction"
          if [ "$GEO_ENABLED" = true ]; then filter="$filter|location waits|location lets"; fi
          npx playwright test --grep "$filter"
        working-directory: web
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: live-browser-evidence
          path: web/test-results/
          retention-days: 7
      - name: Record live visual and cloud evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f web/test-results/studio-desktop-review.jpg ]; then
            python -c "import base64,pathlib; s=base64.b64encode(pathlib.Path('web/test-results/studio-desktop-review.jpg').read_bytes()).decode(); [print('LIVE_VISUAL_CHUNK_'+str(i//4000).zfill(4)+':'+s[i:i+4000]) for i in range(0,len(s),4000)]"
          fi
          if [ -f web/test-results/studio-mobile-review.jpg ]; then
            python -c "import base64,pathlib; s=base64.b64encode(pathlib.Path('web/test-results/studio-mobile-review.jpg').read_bytes()).decode(); [print('MOBILE_VISUAL_CHUNK_'+str(i//4000).zfill(4)+':'+s[i:i+4000]) for i in range(0,len(s),4000)]"
          fi
          git fetch origin evidence/r1
          git worktree add /tmp/bipv-live-evidence origin/evidence/r1
          mkdir -p /tmp/bipv-live-evidence/evidence/live
          find web/test-results -type f \( -name '*.png' -o -name '*.jpg' -o -name 'error-context.md' \) -exec cp {} /tmp/bipv-live-evidence/evidence/live/ \; || true
          python -c "import json,os,pathlib; target=json.loads(pathlib.Path('docs/production-target.json').read_text()); pathlib.Path('/tmp/bipv-live-evidence/evidence/live/run.json').write_text(json.dumps({'deployed_commit':target['commit'],'status':os.environ['JOB_STATUS'],'run_id':os.environ['GITHUB_RUN_ID']},indent=2))"
          git -C /tmp/bipv-live-evidence config user.name "github-actions[bot]"
          git -C /tmp/bipv-live-evidence config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/bipv-live-evidence add evidence/live
          git -C /tmp/bipv-live-evidence diff --cached --quiet || git -C /tmp/bipv-live-evidence commit -m "Record deployed R1 verification"
          git -C /tmp/bipv-live-evidence push origin HEAD:evidence/r1
